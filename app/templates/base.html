<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Monitoring Proxy{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ v }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body data-page="{{ active }}">
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">AI</span>
    <span class="brand-text">Monitoring&nbsp;Proxy</span>
  </a>
  <nav class="nav">
    <a href="/monitor" class="{{ 'is-active' if active == 'monitor' }}">Лог</a>
    <a href="/balance" class="{{ 'is-active' if active == 'balance' }}">Баланс</a>
    <a href="/models" class="{{ 'is-active' if active == 'models' }}">Модели</a>
    <a href="/docs" class="{{ 'is-active' if active == 'docs' }}">Документация</a>
    <a href="/settings" class="{{ 'is-active' if active == 'settings' }}">Настройки</a>
  </nav>
  <div class="topbar-right">
    <a href="/balance" class="balance-chip" id="balance-chip" title="Текущий баланс ИИ-API">
      <span class="balance-chip-label">баланс</span>
      <span class="balance-chip-value" id="balance-chip-value">—</span>
    </a>
  </div>
</header>

{% if not configured and active != 'settings' %}
<div class="banner banner-warn">
  Прокси не настроен — укажите API-ключ и base URL в <a href="/settings">настройках</a>.
</div>
{% endif %}

<main class="page">
  {% block content %}{% endblock %}
</main>

<script src="/static/common.js?v={{ v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
